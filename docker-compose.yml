services:
  backend:
    restart: always
    image: kobums/apple_music_playlist
    ports:
      - "8002:8002"
    env_file:
      - .env
    volumes:
      # MusicKit 개인 키. 이미지는 공개 레지스트리에 올라가므로 키를 굽지 않고
      # 여기서 읽기 전용으로 넣어 준다. 호스트/컨테이너 경로를 같게 두어
      # PRIVATE_KEY_PATH 를 그대로 쓸 수 있게 했다.
      #
      # 서버 준비:
      #   sudo mkdir -p /data/apple_music_playlist
      #   sudo cp AuthKey_XXXXXXXXXX.p8 /data/apple_music_playlist/
      #   sudo chown 10001:10001 /data/apple_music_playlist/AuthKey_*.p8
      #   sudo chmod 400 /data/apple_music_playlist/AuthKey_*.p8
      #
      # 컨테이너는 uid 10001(app) 로 돌기 때문에 소유자를 맞춰야 읽을 수 있다.
      # .env 에 아래를 넣는다:
      #   PRIVATE_KEY_PATH=/data/apple_music_playlist/AuthKey_XXXXXXXXXX.p8
      - /data/apple_music_playlist:/data/apple_music_playlist:ro
      - /home/apple_music_playlist/webdata:/usr/local/main/webdata
